allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.ext.flutter = [
    compileSdkVersion: 36,
    targetSdkVersion: 36,
    minSdkVersion: 24,
]

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects { p ->
    p.afterEvaluate {
        if (p.hasProperty('android')) {
            p.android {
                // Wajib 36: Play menolak app baru yang targetSdk < 36 sejak 31 Agu 2026.
                compileSdkVersion 36
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}


