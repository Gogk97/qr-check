<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Sys'; src: local('Helvetica Neue'), local('Inter'), local('Segoe UI'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: 'Sys', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0A0E0D;
    color: #F1F5F3;
    position: relative;
  }
  .glow {
    position: absolute; width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(11,135,96,.45) 0%, rgba(11,135,96,0) 68%);
    left: -180px; top: -230px;
  }
  .glow2 {
    position: absolute; width: 460px; height: 460px; border-radius: 50%;
    background: radial-gradient(circle, rgba(198,125,21,.22) 0%, rgba(198,125,21,0) 70%);
    right: -120px; bottom: -180px;
  }
  .wrap {
    position: relative; display: flex; align-items: center;
    height: 100%; padding: 0 64px; gap: 40px;
  }
  .logo {
    width: 168px; height: 168px; border-radius: 38px; flex-shrink: 0;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
  }
  .txt { flex: 1; }
  h1 {
    font-size: 62px; font-weight: 800; letter-spacing: -2.2px; line-height: 1;
    background: linear-gradient(92deg, #FFFFFF 0%, #9FE7CC 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub {
    margin-top: 14px; font-size: 25px; font-weight: 500; color: #B9C6C0;
    letter-spacing: -0.4px;
  }
  .chips { display: flex; gap: 10px; margin-top: 26px; }
  .chip {
    font-size: 15.5px; font-weight: 600; padding: 9px 16px; border-radius: 999px;
    background: rgba(11,135,96,.16); color: #7FE0BC;
    border: 1px solid rgba(11,135,96,.45);
  }
  .chip.amber {
    background: rgba(198,125,21,.14); color: #E8B45C;
    border-color: rgba(198,125,21,.42);
  }
  .qr {
    position: absolute; right: 54px; bottom: 44px; width: 118px; height: 118px;
    opacity: .16;
  }
  .badge {
    position: absolute; right: 56px; top: 44px;
    font-size: 13px; font-weight: 700; letter-spacing: 1.6px;
    color: rgba(241,245,243,.68); text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="badge">Pemindaian lokal · 100% privat</div>
  <div class="wrap">
    <img class="logo" src="../assets/images/app_logo.png" alt="">
    <div class="txt">
      <h1>Qristal</h1>
      <div class="sub">Pindai &amp; bersihkan foto QRIS dari galeri</div>
      <div class="chips">
        <div class="chip">Pindai otomatis</div>
        <div class="chip">Hapus massal</div>
        <div class="chip amber">Tanpa upload</div>
      </div>
    </div>
  </div>
  <svg class="qr" viewBox="0 0 100 100" fill="#F1F5F3">
    <rect x="0" y="0" width="26" height="26"/><rect x="6" y="6" width="14" height="14" fill="#0A0E0D"/>
    <rect x="74" y="0" width="26" height="26"/><rect x="80" y="6" width="14" height="14" fill="#0A0E0D"/>
    <rect x="0" y="74" width="26" height="26"/><rect x="6" y="80" width="14" height="14" fill="#0A0E0D"/>
    <rect x="36" y="4" width="8" height="8"/><rect x="50" y="4" width="8" height="8"/>
    <rect x="36" y="20" width="8" height="8"/><rect x="58" y="16" width="8" height="8"/>
    <rect x="4" y="36" width="8" height="8"/><rect x="20" y="40" width="8" height="8"/>
    <rect x="36" y="36" width="12" height="12"/><rect x="56" y="40" width="8" height="8"/>
    <rect x="72" y="36" width="8" height="8"/><rect x="86" y="44" width="8" height="8"/>
    <rect x="40" y="58" width="8" height="8"/><rect x="56" y="62" width="8" height="8"/>
    <rect x="72" y="58" width="12" height="8"/><rect x="88" y="66" width="8" height="8"/>
    <rect x="36" y="76" width="8" height="8"/><rect x="52" y="80" width="8" height="8"/>
    <rect x="68" y="76" width="8" height="8"/><rect x="80" y="84" width="8" height="8"/>
    <rect x="40" y="90" width="8" height="8"/><rect x="58" y="92" width="8" height="8"/>
  </svg>
</body>
</html>
